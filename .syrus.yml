# `just` is not on PATH in the Syrus worker, so install it to ~/.local/bin
# and call it by absolute path everywhere.
prepare:
  - test -x ~/.local/bin/just || curl -sSfL https://just.systems/install.sh | bash -s -- --to ~/.local/bin
  - ~/.local/bin/just venv

grade:
  - name: lint
    run: ~/.local/bin/just lint
    phases: [review, landing, ci]
  - name: typecheck
    run: ~/.local/bin/just typecheck
    phases: [review, landing, ci]
  - name: test-cov
    run: ~/.local/bin/just test-cov
    phases: [review, landing, ci]

preview:
  start: |
    mkdir -p tests/e2e/artifacts
    if [ ! -f tests/e2e/artifacts/index.html ]; then
      ~/.local/bin/just test-e2e || true
    fi
    if [ ! -f tests/e2e/artifacts/index.html ]; then
      echo '<!DOCTYPE html><html><body><h1>No transcripts available</h1><p>Run <code>just test-e2e</code> to generate transcript HTML.</p></body></html>' > tests/e2e/artifacts/index.html
    fi
    cd tests/e2e/artifacts
    exec python3 -m http.server "$PORT"
  health_check: /index.html
